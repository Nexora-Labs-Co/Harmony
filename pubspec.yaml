name: harmony
description: Nexora Music Player - Flutter + Dart + Rust (Beta 26.10.27)
publish_to: 'none'
version: 26.10.28+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_picker: ^13.3.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  ffi: ^2.1.3
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  watcher: ^1.2.1
  youtube_explode_dart: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  auto_updater: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Gliker
      fonts:
        - asset: assets/fonts/Gliker-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/Logo-Harmony-512.png"
  min_sdk_android: 21
  adaptive_icon_background: "#090c02"
  adaptive_icon_foreground: "assets/icons/Logo-Harmony-512.png"
