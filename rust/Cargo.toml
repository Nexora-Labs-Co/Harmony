[workspace]
members = ["crates/nexora_core", "rust_builder"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
rodio = { version = "0.19", default-features = true, features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
flutter_rust_bridge = "=2.4.0"
lazy_static = "1.5"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
pathdiff = "0.2"
notify = "6.1"
id3 = "1.14"
metaflac = "0.2"
lofty = "0.21"
rodio = "0.19"
souvlaki = "0.7"
mpris-server = "0.8"
image = "0.25"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
once_cell = "1.20"
parking_lot = "0.12"
