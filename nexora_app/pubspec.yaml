name: nexora_app
description: Nexora Music Player - Flutter + Dart + Rust
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_rust_bridge: 2.4.0
  rust_builder:
    path: ../rust_builder
  ffi: ^2.1.3
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  rxdart: ^0.28.0
  collection: ^1.18.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  ffigen: ^13.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
