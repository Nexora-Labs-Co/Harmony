name: nexora_app
description: Nexora Music Player - Flutter + Dart + Rust (Beta 26.10.27)
publish_to: 'none'
version: 26.10.27+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  ffi: ^2.1.3
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
